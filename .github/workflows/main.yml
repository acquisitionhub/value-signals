name: Value signals

on:
  schedule:
    - cron: "0 7 * * 2-6"   # daily check, Tue-Sat 07:00 UTC (after each US trading day)
    - cron: "0 8 * * 6"     # weekly report + screener, Saturday 08:00 UTC
  workflow_dispatch:         # "Run workflow" button on the Actions tab
    inputs:
      mode:
        description: "Which run?"
        type: choice
        options: [weekly, daily]
        default: weekly

permissions:
  contents: write            # lets the workflow save results back into the repo

concurrency:
  group: value-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Reuse downloaded SEC filings (they never change)
        uses: actions/cache@v4
        with:
          path: cache
          key: sec-${{ github.run_id }}
          restore-keys: sec-

      - name: Work out daily or weekly
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 * * 6" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Screener (weekly only)
        if: steps.mode.outputs.mode == 'weekly'
        run: python screener.py --all-theses

      - name: Signals (+ paper trading if Alpaca keys are set)
        run: |
          PAPER=""
          if [ -n "$ALPACA_KEY_ID" ] && [ -n "$ALPACA_SECRET_KEY" ]; then PAPER="--paper"; fi
          python signals.py --mode ${{ steps.mode.outputs.mode }} $PAPER

      - name: Build dashboard
        if: always()
        run: python dashboard.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name  "value-signals-bot"
          git config user.email "actions@users.noreply.github.com"
          for d in output docs; do [ -e "$d" ] && git add "$d"; done
          git diff --cached --quiet || git commit -m "Signals ${{ steps.mode.outputs.mode }} run $(date -u +%F)"
          git push origin HEAD:${{ github.ref_name }}
